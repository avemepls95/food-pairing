<input type="search" class="search input" [(ngModel)]="searchTerm"
       [placeholder]="placeholder()" [attr.aria-label]="placeholder()"
       autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">

<div class="product-list">
  @for (group of filteredGroups; track group.category) {
    <div class="category-group">
      <h2 class="category-title">
        <span class="dot" [style.background]="color(group.category)"></span>
        {{ group.category }}
      </h2>
      <div class="product-items">
        @for (item of group.items; track item) {
          <label class="product-item" [class.locked]="!!lockHint(item)" [title]="lockHint(item)">
            <input type="checkbox" [checked]="isSelected(item)" [disabled]="!!lockHint(item)"
                   (change)="toggled.emit(item)">
            <span>{{ item }}</span>
          </label>
        }
      </div>
    </div>
  } @empty {
    <p class="hint empty">Ничего не найдено</p>
  }
</div>
